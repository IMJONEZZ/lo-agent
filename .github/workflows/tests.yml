# The default test suite, with branch coverage, on every push to main and every pull request.
# It runs the unit tests, the journey tests and the composability DAGs on the mock model.
# Real-model runs, the pseudo-terminal and live-model journeys, and mutation testing are not
# run here: they need a model server or much longer runs.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"

      - name: Install lo and its dev dependencies
        run: uv sync --frozen --group dev --python 3.13

      - name: Run the tests with branch coverage
        env:
          LO_DAG_REPORT: dag-results.md
        run: uv run --frozen --group dev coverage run -m pytest -q -p no:cacheprovider

      - name: Coverage report
        if: always()
        run: uv run --frozen --group dev coverage report

      - name: Composability DAG results
        if: always()
        run: if [ -f dag-results.md ]; then cat dag-results.md; else echo "no DAG report"; fi
